<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>404 | NQV.</title><link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml"><style>:root{color-scheme:light dark;--bg:#f8fafc;--text:#172b3d;--muted:#475569;--primary:#344d75;--button:#fff;--border:#dce3ed;--tint:#e8ecf8;--accent:#2f7367}html[data-theme=dark]{--bg:#111827;--text:#f1f5f9;--muted:#cbd5e1;--primary:#a7bfeb;--button:#111827;--border:#334155;--tint:#202d46;--accent:#7dc5b7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 15%,var(--tint),transparent 65%),var(--bg);color:var(--text);font:16px/1.6 Arial,Helvetica,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{max-width:610px;width:100%;border:1px solid var(--border);border-radius:24px;padding:clamp(24px,7vw,64px)}.brand{color:var(--primary);font-size:20px;font-weight:bold}.brand span,.code{color:var(--accent)}.code{font-size:clamp(50px,14vw,100px);font-weight:bold;line-height:1;margin:36px 0 12px}h1{font-size:clamp(24px,5vw,36px);line-height:1.3;margin:0}p{color:var(--muted);margin:14px 0 28px}a{display:inline-block;text-decoration:none;background:var(--primary);color:var(--button);padding:12px 20px;border-radius:10px;font-weight:bold}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}</style><script>(function(){try{var t=localStorage.getItem('nqv-theme');document.documentElement.dataset.theme=t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'}catch(e){}})();</script></head><body><main><div class="brand">NQV<span>.</span></div><div class="code">404</div><h1 id="heading">Không tìm thấy trang.</h1><p id="message">Đường dẫn có thể đã thay đổi. Bạn có thể quay lại Portfolio để xem hồ sơ và CV.</p><a id="home" href="/">← Về trang chủ</a></main><script>try{if(localStorage.getItem('nqv-lang')==='en'){document.documentElement.lang='en';document.getElementById('heading').textContent='Page not found.';document.getElementById('message').textContent='This link may have changed. Return to the portfolio to explore the profile and CV.';document.getElementById('home').textContent='← Back to home';}}catch(e){}</script></body></html>
